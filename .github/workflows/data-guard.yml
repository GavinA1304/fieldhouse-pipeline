name: data-guard
# Fails if a data file or credential ever gets committed. This is the alarm;
# .gitignore is the lock. If this ever goes red, the file is already in the
# public history: delete the repo's copy, rotate any token, and purge history.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: No data files, no big files, no tokens
        run: |
          bad=0
          data=$(git ls-files | grep -Ei '\.(parquet|csv|tsv|rds|rdata|feather|arrow|xlsx?|json\.gz|zip|sqlite|db)$' || true)
          if [ -n "$data" ]; then echo "::error::Data files are committed:"; echo "$data"; bad=1; fi
          big=$(git ls-files -z | xargs -0 -I{} find {} -size +1M 2>/dev/null || true)
          if [ -n "$big" ]; then echo "::error::Files over 1 MB (data?):"; echo "$big"; bad=1; fi
          if git grep -nE '(hf_[A-Za-z0-9]{30,}|client_secret\s*[:=]\s*["'"'"'][^"'"'"']+)' -- . ':!.github/workflows/data-guard.yml'; then
            echo "::error::Something that looks like a credential is committed."; bad=1
          fi
          exit $bad
